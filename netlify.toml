[build]
  command = "npm run build"
  publish = "public"
[[redirects]]
  from = "/machine"
  to = "/machine.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
