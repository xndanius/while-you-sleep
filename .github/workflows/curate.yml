name: Select the best checked ideas for LinkedIn RSS
on:
  schedule:
    - cron: '17,47 * * * *'
      timezone: Europe/Vilnius
  workflow_dispatch:
    inputs:
      clock_tick_run_id:
        description: Trusted hosted clock parent run, verified against its receipt
        type: string
        default: ''
      clock_dispatch_id:
        description: Exact dispatch receipt identifier
        type: string
        default: ''
      clock_parent_attempt:
        description: Hosted clock parent attempt
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: while-you-sleep-curate
  cancel-in-progress: false
  queue: max
env:
  RUN_ID: curate-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  ensure-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      deployments: write
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Keep the existing hosted clock alive
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_RUNTIME_MODE: deployments-v1
        run: node scripts/ensure-clock.mjs
  curate:
    needs: ensure-clock
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    outputs:
      committed: ${{ steps.publish.outputs.committed }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOCK_TICK_RUN_ID: ${{ inputs.clock_tick_run_id || '' }}
      CLOCK_DISPATCH_ID: ${{ inputs.clock_dispatch_id || '' }}
      CLOCK_PARENT_ATTEMPT: ${{ inputs.clock_parent_attempt || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - id: gate
        name: Check only activation-aware unsettled curation slots
        run: node scripts/curate-posts.mjs gate
      - if: steps.gate.outputs.due == 'true'
        run: npm ci --ignore-scripts
      - id: publish
        if: steps.gate.outputs.due == 'true'
        name: Commit one deterministic checked selection or terminal empty receipt per due slot
        run: node scripts/curate-posts.mjs publish
  pages:
    needs: curate
    if: needs.curate.outputs.committed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
