name: Public source research
on:
  schedule:
    - cron: '0 */3 * * *'
      timezone: Europe/Vilnius
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: while-you-sleep-record
  cancel-in-progress: false
  queue: max
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/research-snapshot.mjs "$RUN_ID"
        env:
          RUN_ID: research-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        run: node scripts/commit-records.mjs research "$RUN_ID"
        env:
          RUN_ID: research-${{ github.run_id }}-${{ github.run_attempt }}
  pages:
    needs: research
    if: always() && needs.research.result == 'success'
    uses: ./.github/workflows/pages.yml
