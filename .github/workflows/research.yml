name: Public source research
on:
  schedule:
    - cron: '23,53 * * * *'
      timezone: Europe/Vilnius
  workflow_dispatch:
    inputs:
      clock_tick_run_id:
        description: Trusted hosted clock parent run, verified against its receipt
        type: string
        default: ''
      clock_dispatch_id:
        description: Exact dispatch receipt identifier
        type: string
        default: ''
      clock_parent_attempt:
        description: Hosted clock parent attempt
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: while-you-sleep-record
  cancel-in-progress: false
  queue: max
jobs:
  ensure-clock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Keep one hosted clock chain alive
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_RUNTIME_MODE: deployments-v1
        run: node scripts/ensure-clock.mjs
  research:
    needs: ensure-clock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - id: gate
        name: Select the latest elapsed research slot
        run: node scripts/prepare-scheduled-job.mjs research
        env:
          RUN_ID: research-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          CLOCK_TICK_RUN_ID: ${{ inputs.clock_tick_run_id || '' }}
          CLOCK_DISPATCH_ID: ${{ inputs.clock_dispatch_id || '' }}
          CLOCK_PARENT_ATTEMPT: ${{ inputs.clock_parent_attempt || '' }}
      - if: steps.gate.outputs.due == 'true'
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.due == 'true'
        run: node scripts/research-snapshot.mjs "$RUN_ID"
        env:
          RUN_ID: ${{ steps.gate.outputs.runId }}
          SCHEDULED_JOB_KEY: ${{ steps.gate.outputs.jobKey }}
          SCHEDULED_AT: ${{ steps.gate.outputs.scheduledAt }}
          SCHEDULED_CLOCK_JSON: ${{ steps.gate.outputs.clock }}
      - if: always() && steps.gate.outputs.due == 'true'
        run: node scripts/commit-records.mjs research "$RUN_ID"
        env:
          RUN_ID: ${{ steps.gate.outputs.runId }}
  pages:
    needs: research
    if: always() && needs.research.result == 'success' && needs.research.outputs.due == 'true'
    uses: ./.github/workflows/pages.yml
