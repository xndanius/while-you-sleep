name: Codex autonomous loop
on:
  schedule:
    - cron: '7,27,47 * * * *'
      timezone: Europe/Vilnius
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Produce the first three checked posts using the same cloud loop
        type: boolean
        default: false
      clock_tick_run_id:
        description: Trusted hosted clock parent run, verified against its receipt
        type: string
        default: ''
      clock_dispatch_id:
        description: Exact dispatch receipt identifier
        type: string
        default: ''
      clock_parent_attempt:
        description: Hosted clock parent attempt
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: while-you-sleep-loop
  cancel-in-progress: false
  queue: max
env:
  RUN_ID: loop-${{ github.run_id }}-${{ github.run_attempt }}
  DEMAND_CONTRACT_VERSION: '1'
  DISCUSSION_ONLY: 'true'
  BOOTSTRAP: ${{ inputs.bootstrap || false }}
  PUBLIC_BASE_URL: https://xndanius.github.io/while-you-sleep
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: write
      deployments: write
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    outputs:
      run_models: ${{ steps.slot.outputs.run_models }}
      target_count: ${{ steps.slot.outputs.target_count }}
      scheduling_sha256: ${{ steps.slot.outputs.scheduling_sha256 }}
      clock_verified: ${{ steps.slot.outputs.clock_verified }}
      repo_sha: ${{ steps.commit.outputs.repo_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Keep one hosted clock chain alive
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_RUNTIME_MODE: deployments-v1
        run: node scripts/ensure-clock.mjs
      - name: Select and reserve every due publication slot of the Vilnius day
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_TRIGGER_CRON: ${{ github.event.schedule || '' }}
          CLOCK_TICK_RUN_ID: ${{ inputs.clock_tick_run_id || '' }}
          CLOCK_DISPATCH_ID: ${{ inputs.clock_dispatch_id || '' }}
          CLOCK_PARENT_ATTEMPT: ${{ inputs.clock_parent_attempt || '' }}
        run: node scripts/prepare-loop.mjs
      - name: Persist the trusted reservation before any model runs
        if: steps.slot.outputs.run_models == 'true'
        id: commit
        run: |
          node scripts/commit-records.mjs gate "$RUN_ID"
          echo "repo_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  social_research:
    needs: gate
    if: needs.gate.outputs.run_models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    outputs:
      social_demand_sha256: ${{ steps.social.outputs.social_demand_sha256 }}
      social_demand_head_sha: ${{ steps.social.outputs.social_demand_head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: social
        name: Collect optional official social discovery without model access
        continue-on-error: true
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_API_ACCESS_APPROVED: ${{ vars.REDDIT_API_ACCESS_APPROVED }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_INGESTION_CAP_MODE: ingested
          GH_TOKEN: ${{ github.token }}
        run: SOCIAL_SOURCE_HEAD_SHA="$(git rev-parse HEAD)" node scripts/collect-social-demand.mjs "$RUN_ID" research
      - if: steps.social.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: social-discovery-${{ env.RUN_ID }}
          path: .run/social-demand-research.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Persist only safe API receipts
        if: always()
        run: node scripts/commit-social-receipts.mjs
  writer:
    needs: [gate, social_research]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run_models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      repo_sha: ${{ steps.trust.outputs.repo_sha }}
      rules_sha256: ${{ steps.trust.outputs.rules_sha256 }}
      source_scan_sha256: ${{ steps.scan.outputs.source_scan_sha256 || steps.continuation_seal.outputs.source_scan_sha256 }}
      source_scan_head_sha: ${{ steps.scan.outputs.source_scan_head_sha || steps.trust.outputs.repo_sha }}
      learning_selection_sha256: ${{ steps.scan.outputs.learning_selection_sha256 || steps.continuation_seal.outputs.learning_selection_sha256 }}
      no_fresh_leads_sha256: ${{ steps.scan.outputs.no_fresh_leads_sha256 }}
      research_sha256: ${{ steps.scan.outputs.research_sha256 }}
      research_intent_sha256: ${{ steps.continuation_plan.outputs.intent_sha256 }}
      research_result_sha256: ${{ steps.continuation_seal.outputs.result_sha256 }}
      readiness_reason: ${{ steps.prepare.outputs.readiness_reason }}
      model_completed: ${{ steps.model.outcome == 'success' }}
      model_attempted: ${{ contains(fromJSON('["success", "failure", "cancelled"]'), steps.model.outcome) }}
      privacy_safe: ${{ steps.privacy.outputs.safe }}
      scan_privacy_safe: ${{ steps.scan_privacy.outputs.safe }}
    env:
      LOOP_SCHEDULING_SHA: ${{ needs.gate.outputs.scheduling_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.gate.outputs.repo_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch only the sealed social discovery hints
        if: needs.social_research.outputs.social_demand_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: social-discovery-${{ env.RUN_ID }}
          path: .staging/social-discovery/
      - name: Freeze the code and rules used by this loop
        id: trust
        run: |
          echo "repo_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rules_sha256=$(sha256sum RULES.md | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check secure model access
        env:
          MODEL_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$MODEL_KEY" ]; then
            echo '::error::OPENAI_API_KEY is not installed. Complete secure setup, then dispatch bootstrap.'
            exit 1
          fi
      - name: Seal one bounded continuation intent before acquisition
        id: continuation_plan
        env:
          SOURCE_HEAD_SHA: ${{ steps.trust.outputs.repo_sha }}
        run: node scripts/prepare-research-continuation.mjs "$RUN_ID"
      - name: Preserve continuation intent before any acquisition starts
        if: steps.continuation_plan.outputs.intent_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-intent-${{ env.RUN_ID }}
          path: data/research-intents/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Freeze the original guarded scan before model access
        id: scan
        continue-on-error: true
        env:
          SOURCE_HEAD_SHA: ${{ steps.trust.outputs.repo_sha }}
          SOCIAL_DEMAND_PATH: ${{ needs.social_research.outputs.social_demand_sha256 != '' && '.staging/social-discovery/social-demand-research.json' || '' }}
          EXPECTED_SOCIAL_DEMAND_SHA: ${{ needs.social_research.outputs.social_demand_sha256 }}
          EXPECTED_SOCIAL_DEMAND_HEAD_SHA: ${{ needs.social_research.outputs.social_demand_head_sha }}
          EXPECTED_RESEARCH_INTENT_SHA: ${{ steps.continuation_plan.outputs.intent_sha256 }}
        run: node scripts/research-snapshot.mjs "$RUN_ID"
      - name: Seal continuation results including interrupted acquisition
        id: continuation_seal
        if: always() && steps.continuation_plan.outputs.intent_sha256 != ''
        env:
          EXPECTED_RESEARCH_INTENT_SHA: ${{ steps.continuation_plan.outputs.intent_sha256 }}
          SOURCE_HEAD_SHA: ${{ steps.trust.outputs.repo_sha }}
        run: node scripts/seal-research-continuation.mjs "$RUN_ID"
      - name: Preserve continuation result outside model-owned files
        if: always() && steps.continuation_seal.outputs.result_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-result-${{ env.RUN_ID }}
          path: data/research-results/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Seal a deterministic empty-lead completion before any model access
        if: always() && steps.scan.outputs.no_fresh_leads_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: no-fresh-leads-${{ env.RUN_ID }}
          path: data/no-fresh-leads/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify scan privacy before any model or source artifact upload
        id: scan_privacy
        if: always()
        continue-on-error: true
        run: node scripts/guard-private-artifacts.mjs "$RUN_ID" scan
      - name: Seal the original scan in a separate pre-model artifact
        if: always() && (steps.scan.outputs.source_scan_sha256 != '' || steps.continuation_seal.outputs.source_scan_sha256 != '') && steps.scan_privacy.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-scan-${{ env.RUN_ID }}
          path: data/source-scans/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Seal the customer selection before any model access
        if: always() && (steps.scan.outputs.learning_selection_sha256 != '' || steps.continuation_seal.outputs.learning_selection_sha256 != '') && steps.scan_privacy.outputs.selection_safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-selection-${{ env.RUN_ID }}
          path: data/learning-selection/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare the bounded writer
        id: prepare
        if: steps.scan.outcome == 'success' && steps.scan_privacy.outputs.safe == 'true'
        continue-on-error: true
        env:
          EXPECTED_RESEARCH_SHA: ${{ steps.scan.outputs.research_sha256 }}
          EXPECTED_LEARNING_SELECTION_SHA: ${{ steps.scan.outputs.learning_selection_sha256 }}
          EXPECTED_RESEARCH_INTENT_SHA: ${{ steps.continuation_plan.outputs.intent_sha256 }}
          EXPECTED_RESEARCH_RESULT_SHA: ${{ steps.continuation_seal.outputs.result_sha256 }}
        run: node scripts/prepare-run.mjs writer
      - name: Codex picks and writes
        id: model
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.ready != 'false'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        env:
          EXPECTED_RESEARCH_SHA: ${{ steps.scan.outputs.research_sha256 }}
          EXPECTED_LEARNING_SELECTION_SHA: ${{ steps.scan.outputs.learning_selection_sha256 }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          prompt-file: .github/codex/prompts/writer.md
          codex-args: '["--ephemeral", "--json"]'
      - name: Verify privacy before uploading model-written content
        id: privacy
        if: always()
        continue-on-error: true
        run: node scripts/guard-private-artifacts.mjs "$RUN_ID" writer
      - name: Carry only data records to the independent checker
        if: always() && steps.privacy.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-${{ env.RUN_ID }}
          path: |
            data/research/${{ env.RUN_ID }}.json
            data/drafts/${{ env.RUN_ID }}.json
          if-no-files-found: warn
          retention-days: 7
  checker:
    needs: [gate, writer]
    if: needs.writer.result == 'success' && needs.writer.outputs.model_completed == 'true' && needs.writer.outputs.privacy_safe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CHECKER_PHASE: initial
      LOOP_SCHEDULING_SHA: ${{ needs.gate.outputs.scheduling_sha256 }}
      EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
      EXPECTED_RESEARCH_SHA: ${{ needs.writer.outputs.research_sha256 }}
    outputs:
      repair: ${{ steps.verdict.outputs.repair }}
      privacy_safe: ${{ steps.privacy.outputs.safe }}
      verified: ${{ steps.prepare.outputs.verified || steps.accept.outputs.verified }}
      repair_feedback_verified: ${{ steps.accept.outputs.repair_feedback_verified }}
      repair_feedback_sha256: ${{ steps.accept.outputs.repair_feedback_sha256 }}
      unverified_code: ${{ steps.prepare.outputs.unverified_code || steps.accept.outputs.unverified_code }}
      unverified_reason: ${{ steps.prepare.outputs.unverified_reason || steps.accept.outputs.unverified_reason }}
      model_completed: ${{ steps.model.outcome == 'success' }}
      model_attempted: ${{ contains(fromJSON('["success", "failure", "cancelled"]'), steps.model.outcome) }}
      draft_sha256: ${{ steps.fingerprint.outputs.draft_sha256 }}
      context_sha256: ${{ steps.fingerprint.outputs.context_sha256 }}
      check_diagnostics_sha256: ${{ steps.prepare.outputs.check_diagnostics_sha256 }}
      check_diagnostics_draft_sha256: ${{ steps.prepare.outputs.check_diagnostics_draft_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.writer.outputs.repo_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: writer-${{ env.RUN_ID }}
          path: data/
      - name: Fetch the sealed pre-model customer selection
        if: needs.writer.outputs.learning_selection_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: learning-selection-${{ env.RUN_ID }}
          path: .staging/learning-selection/
      - name: Import only the fingerprinted customer selection
        if: needs.writer.outputs.learning_selection_sha256 != ''
        env:
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.source_scan_head_sha }}
        run: node scripts/import-learning-selection.mjs .staging/learning-selection "$RUN_ID"
      - id: prepare
        continue-on-error: true
        run: node scripts/prepare-check.mjs "$RUN_ID" && node scripts/prepare-run.mjs checker
      - id: fingerprint
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: node scripts/fingerprint-check.mjs "$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Independent Codex checker
        id: model
        if: steps.fingerprint.outcome == 'success'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          prompt-file: .github/codex/prompts/checker.md
          output-file: .run/checker-response.json
          output-schema-file: .run/checker-output-schema.json
          codex-args: '["--ephemeral", "--json"]'
      - name: Verify independent-output privacy before accepting or uploading it
        id: privacy
        if: always()
        continue-on-error: true
        run: node scripts/guard-private-artifacts.mjs "$RUN_ID" checker
      - name: Accept only a fresh independent output bound to the frozen context
        id: accept
        if: always() && steps.prepare.outcome == 'success' && steps.privacy.outputs.safe == 'true'
        env:
          EXPECTED_DRAFT_SHA: ${{ steps.fingerprint.outputs.draft_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ steps.fingerprint.outputs.context_sha256 }}
        run: node scripts/accept-check-output.mjs "$RUN_ID"
      - name: Determine whether one repair is needed
        if: steps.accept.outputs.verified == 'true' && steps.model.outcome == 'success'
        continue-on-error: true
        id: verdict
        env:
          EXPECTED_REPAIR_FEEDBACK_SHA: ${{ steps.accept.outputs.repair_feedback_sha256 }}
        run: node scripts/check-verdict.mjs "$RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outputs.safe == 'true'
        with:
          name: checked-${{ env.RUN_ID }}
          path: |
            data/research/${{ env.RUN_ID }}.json
            data/drafts/${{ env.RUN_ID }}.json
            data/check-context/${{ env.RUN_ID }}.json
            data/checks/${{ env.RUN_ID }}.json
          retention-days: 7
      - name: Preserve separately sealed unavailable-evidence diagnostics
        if: always() && steps.privacy.outputs.safe == 'true' && steps.prepare.outputs.check_diagnostics_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-diagnostics-initial-${{ env.RUN_ID }}
          path: data/check-diagnostics/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 7
  repair:
    outputs:
      model_completed: ${{ steps.model.outcome == 'success' }}
      model_attempted: ${{ contains(fromJSON('["success", "failure", "cancelled"]'), steps.model.outcome) }}
      privacy_safe: ${{ steps.privacy.outputs.safe }}
    needs: [gate, writer, checker]
    if: needs.checker.outputs.verified == 'true' && needs.checker.outputs.repair == 'true' && needs.checker.outputs.privacy_safe == 'true' && (needs.checker.outputs.repair_feedback_verified == 'false' || (needs.checker.outputs.repair_feedback_verified == 'true' && needs.checker.outputs.repair_feedback_sha256 != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LOOP_SCHEDULING_SHA: ${{ needs.gate.outputs.scheduling_sha256 }}
      EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
      EXPECTED_RESEARCH_SHA: ${{ needs.writer.outputs.research_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.writer.outputs.repo_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-${{ env.RUN_ID }}
          path: data/
      - name: Fetch the original customer selection for the bounded repair
        if: needs.writer.outputs.learning_selection_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: learning-selection-${{ env.RUN_ID }}
          path: .staging/learning-selection/
      - name: Import the sealed customer selection before repair access
        if: needs.writer.outputs.learning_selection_sha256 != ''
        env:
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.source_scan_head_sha }}
        run: node scripts/import-learning-selection.mjs .staging/learning-selection "$RUN_ID"
      - id: prepare
        continue-on-error: true
        env:
          EXPECTED_FIRST_DRAFT_SHA: ${{ needs.checker.outputs.draft_sha256 }}
          EXPECTED_FIRST_CONTEXT_SHA: ${{ needs.checker.outputs.context_sha256 }}
          EXPECTED_REPAIR_FEEDBACK_SHA: ${{ needs.checker.outputs.repair_feedback_sha256 }}
        run: node scripts/save-first-check.mjs "$RUN_ID" && node scripts/prepare-run.mjs repair
      - name: Codex repairs once
        id: model
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          prompt-file: .github/codex/prompts/writer.md
          codex-args: '["--ephemeral", "--json"]'
      - name: Verify repaired-content privacy before its artifact upload
        id: privacy
        if: always()
        continue-on-error: true
        run: node scripts/guard-private-artifacts.mjs "$RUN_ID" repair
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outputs.safe == 'true'
        with:
          name: repaired-${{ env.RUN_ID }}
          path: |
            data/research/${{ env.RUN_ID }}.json
            data/drafts/${{ env.RUN_ID }}.json
            data/check-context/${{ env.RUN_ID }}.json
            data/checks/${{ env.RUN_ID }}.json
            data/drafts/${{ env.RUN_ID }}-first.json
            data/check-context/${{ env.RUN_ID }}-first.json
            data/checks/${{ env.RUN_ID }}-first.json
          retention-days: 7
  final_check:
    needs: [gate, writer, checker, repair]
    if: needs.repair.result == 'success' && needs.repair.outputs.model_completed == 'true' && needs.repair.outputs.privacy_safe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CHECKER_PHASE: final
      LOOP_SCHEDULING_SHA: ${{ needs.gate.outputs.scheduling_sha256 }}
      EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
      EXPECTED_RESEARCH_SHA: ${{ needs.writer.outputs.research_sha256 }}
    outputs:
      verified: ${{ steps.prepare.outputs.verified || steps.accept.outputs.verified }}
      privacy_safe: ${{ steps.privacy.outputs.safe }}
      unverified_code: ${{ steps.prepare.outputs.unverified_code || steps.accept.outputs.unverified_code }}
      unverified_reason: ${{ steps.prepare.outputs.unverified_reason || steps.accept.outputs.unverified_reason }}
      model_completed: ${{ steps.model.outcome == 'success' }}
      model_attempted: ${{ contains(fromJSON('["success", "failure", "cancelled"]'), steps.model.outcome) }}
      draft_sha256: ${{ steps.fingerprint.outputs.draft_sha256 }}
      context_sha256: ${{ steps.fingerprint.outputs.context_sha256 }}
      check_diagnostics_sha256: ${{ steps.prepare.outputs.check_diagnostics_sha256 }}
      check_diagnostics_draft_sha256: ${{ steps.prepare.outputs.check_diagnostics_draft_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.writer.outputs.repo_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-${{ env.RUN_ID }}
          path: data/
      - name: Fetch the same sealed customer selection for the fresh checker
        if: needs.writer.outputs.learning_selection_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: learning-selection-${{ env.RUN_ID }}
          path: .staging/learning-selection/
      - name: Import the unchanged pre-model customer selection
        if: needs.writer.outputs.learning_selection_sha256 != ''
        env:
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.source_scan_head_sha }}
        run: node scripts/import-learning-selection.mjs .staging/learning-selection "$RUN_ID"
      - name: Preserve every original screened decision before fresh checking
        id: preserve
        continue-on-error: true
        env:
          EXPECTED_FIRST_DRAFT_SHA: ${{ needs.checker.outputs.draft_sha256 }}
          EXPECTED_FIRST_CONTEXT_SHA: ${{ needs.checker.outputs.context_sha256 }}
          EXPECTED_REPAIR_FEEDBACK_SHA: ${{ needs.checker.outputs.repair_feedback_sha256 }}
        run: node scripts/preserve-repair-considerations.mjs "$RUN_ID"
      - id: prepare
        if: steps.preserve.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-check.mjs "$RUN_ID" && node scripts/prepare-run.mjs final-checker
      - id: fingerprint
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: node scripts/fingerprint-check.mjs "$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Fresh Codex checker after the single repair
        id: model
        if: steps.fingerprint.outcome == 'success'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          prompt-file: .github/codex/prompts/checker.md
          output-file: .run/checker-response.json
          output-schema-file: .run/checker-output-schema.json
          codex-args: '["--ephemeral", "--json"]'
      - name: Verify final independent-output privacy before accepting it
        id: privacy
        if: always()
        continue-on-error: true
        run: node scripts/guard-private-artifacts.mjs "$RUN_ID" final_check
      - name: Accept only the new final independent output
        id: accept
        if: always() && steps.prepare.outcome == 'success' && steps.privacy.outputs.safe == 'true'
        env:
          EXPECTED_DRAFT_SHA: ${{ steps.fingerprint.outputs.draft_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ steps.fingerprint.outputs.context_sha256 }}
        run: node scripts/accept-check-output.mjs "$RUN_ID"
      - name: Verify the original omission record after final model access
        if: always() && steps.prepare.outcome == 'success' && steps.privacy.outputs.safe == 'true' && needs.checker.outputs.repair_feedback_verified == 'true'
        env:
          EXPECTED_FIRST_DRAFT_SHA: ${{ needs.checker.outputs.draft_sha256 }}
          EXPECTED_FIRST_CONTEXT_SHA: ${{ needs.checker.outputs.context_sha256 }}
          EXPECTED_REPAIR_FEEDBACK_SHA: ${{ needs.checker.outputs.repair_feedback_sha256 }}
        run: node scripts/preserve-repair-considerations.mjs "$RUN_ID" --verify-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.privacy.outputs.safe == 'true'
        with:
          name: final-${{ env.RUN_ID }}
          path: |
            data/research/${{ env.RUN_ID }}.json
            data/drafts/${{ env.RUN_ID }}.json
            data/check-context/${{ env.RUN_ID }}.json
            data/checks/${{ env.RUN_ID }}.json
            data/drafts/${{ env.RUN_ID }}-first.json
            data/check-context/${{ env.RUN_ID }}-first.json
            data/checks/${{ env.RUN_ID }}-first.json
          retention-days: 7
      - name: Preserve separately sealed final preparation diagnostics
        if: always() && steps.privacy.outputs.safe == 'true' && steps.prepare.outputs.check_diagnostics_sha256 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-diagnostics-final-${{ env.RUN_ID }}
          path: data/check-diagnostics/${{ env.RUN_ID }}.json
          if-no-files-found: error
          retention-days: 7
  record:
    outputs:
      operational_failure: ${{ steps.finalize.outputs.operational_failure }}
      run_status: ${{ steps.finalize.outputs.run_status }}
    needs: [gate, writer, checker, repair, final_check]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run_models == 'true'
    runs-on: ubuntu-latest
    env:
      LOOP_SCHEDULING_SHA: ${{ needs.gate.outputs.scheduling_sha256 }}
    permissions:
      contents: write
      actions: read
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.gate.outputs.run_models == 'true' && needs.writer.outputs.no_fresh_leads_sha256 == ''
        continue-on-error: true
        with:
          name: ${{ needs.final_check.result != 'skipped' && format('final-{0}', env.RUN_ID) || needs.checker.result != 'skipped' && format('checked-{0}', env.RUN_ID) || format('writer-{0}', env.RUN_ID) }}
          path: .staging/data/
      - name: Fetch only the pre-model scan artifact
        if: needs.writer.outputs.source_scan_sha256 != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-scan-${{ env.RUN_ID }}
          path: .staging/source-scan/
      - name: Import the original scan through its independent trust boundary
        if: needs.writer.outputs.source_scan_sha256 != ''
        continue-on-error: true
        env:
          EXPECTED_SOURCE_SCAN_SHA: ${{ needs.writer.outputs.source_scan_sha256 }}
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.source_scan_head_sha }}
        run: node scripts/import-source-scan.mjs .staging/source-scan "$RUN_ID"
      - name: Fetch the immutable pre-model learning choice
        if: needs.writer.outputs.learning_selection_sha256 != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: learning-selection-${{ env.RUN_ID }}
          path: .staging/learning-selection/
      - name: Import learning selection outside model-owned records
        if: needs.writer.outputs.learning_selection_sha256 != ''
        continue-on-error: true
        env:
          EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.source_scan_head_sha }}
        run: node scripts/import-learning-selection.mjs .staging/learning-selection "$RUN_ID"
      - name: Fetch the original continuation intent
        if: always() && needs.writer.outputs.research_intent_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: research-intent-${{ env.RUN_ID }}
          path: .staging/research-intent/
      - name: Import continuation intent through its pre-model hash
        if: always() && needs.writer.outputs.research_intent_sha256 != ''
        env:
          EXPECTED_CONTINUATION_SHA: ${{ needs.writer.outputs.research_intent_sha256 }}
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.repo_sha }}
        run: node scripts/import-research-continuation.mjs .staging/research-intent intent "$RUN_ID"
      - name: Fetch the sealed continuation result
        if: always() && needs.writer.outputs.research_result_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: research-result-${{ env.RUN_ID }}
          path: .staging/research-result/
      - name: Import continuation result through its pre-model hash
        if: always() && needs.writer.outputs.research_result_sha256 != ''
        env:
          EXPECTED_CONTINUATION_SHA: ${{ needs.writer.outputs.research_result_sha256 }}
          EXPECTED_SOURCE_SCAN_HEAD_SHA: ${{ needs.writer.outputs.repo_sha }}
        run: node scripts/import-research-continuation.mjs .staging/research-result result "$RUN_ID"
      - name: Fetch the separately sealed empty-lead decision
        if: needs.writer.outputs.no_fresh_leads_sha256 != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: no-fresh-leads-${{ env.RUN_ID }}
          path: .staging/no-fresh-leads/
      - name: Import only the trusted fingerprinted empty-lead completion
        if: needs.writer.outputs.no_fresh_leads_sha256 != ''
        env:
          EXPECTED_NO_FRESH_LEADS_SHA: ${{ needs.writer.outputs.no_fresh_leads_sha256 }}
        run: node scripts/import-no-fresh-leads.mjs .staging/no-fresh-leads "$RUN_ID"
      - name: Collect only trusted CLI token usage
        if: needs.gate.outputs.run_models == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          MODEL_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/collect-usage.mjs loop "$RUN_ID"
      - name: Import only data and publish independently checked files
        id: publish
        if: needs.gate.outputs.run_models == 'true' && needs.writer.outputs.no_fresh_leads_sha256 == ''
        continue-on-error: true
        env:
          EXPECTED_DRAFT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.draft_sha256 || needs.checker.outputs.draft_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.context_sha256 || needs.checker.outputs.context_sha256 }}
          RULES_SHA256: ${{ needs.writer.outputs.rules_sha256 }}
          RULES_COMMIT: ${{ needs.writer.outputs.repo_sha }}
        run: node scripts/import-artifact.mjs .staging/data "$RUN_ID"
      - name: Fetch the separately sealed preparation failure receipt
        if: needs.final_check.outputs.check_diagnostics_sha256 != '' || needs.checker.outputs.check_diagnostics_sha256 != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.final_check.outputs.check_diagnostics_sha256 != '' && format('check-diagnostics-final-{0}', env.RUN_ID) || format('check-diagnostics-initial-{0}', env.RUN_ID) }}
          path: .staging/check-diagnostics/
      - name: Import diagnostic-only failure evidence through its trusted fingerprint
        if: needs.final_check.outputs.check_diagnostics_sha256 != '' || needs.checker.outputs.check_diagnostics_sha256 != ''
        continue-on-error: true
        env:
          EXPECTED_CHECK_DIAGNOSTICS_SHA: ${{ needs.final_check.outputs.check_diagnostics_sha256 || needs.checker.outputs.check_diagnostics_sha256 }}
          EXPECTED_DIAGNOSTIC_PHASE: ${{ needs.final_check.outputs.check_diagnostics_sha256 != '' && 'final' || 'initial' }}
          EXPECTED_DIAGNOSTIC_DRAFT_SHA: ${{ needs.final_check.outputs.check_diagnostics_sha256 != '' && needs.final_check.outputs.check_diagnostics_draft_sha256 || needs.checker.outputs.check_diagnostics_draft_sha256 }}
          EXPECTED_RESEARCH_SHA: ${{ needs.writer.outputs.research_sha256 }}
          EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
        run: node scripts/import-check-diagnostics.mjs .staging/check-diagnostics "$RUN_ID"
      - name: Finalize checked publication and settle every reserved slot
        id: finalize
        if: always()
        env:
          MODEL_JOB_RESULTS: ${{ toJSON(needs) }}
          EXPECTED_NO_FRESH_LEADS_SHA: ${{ needs.writer.outputs.no_fresh_leads_sha256 }}
          EXPECTED_CHECK_DIAGNOSTICS_SHA: ${{ needs.final_check.outputs.check_diagnostics_sha256 || needs.checker.outputs.check_diagnostics_sha256 }}
          EXPECTED_DIAGNOSTIC_PHASE: ${{ needs.final_check.outputs.check_diagnostics_sha256 != '' && 'final' || 'initial' }}
          EXPECTED_DIAGNOSTIC_DRAFT_SHA: ${{ needs.final_check.outputs.check_diagnostics_sha256 != '' && needs.final_check.outputs.check_diagnostics_draft_sha256 || needs.checker.outputs.check_diagnostics_draft_sha256 }}
          EXPECTED_RESEARCH_SHA: ${{ needs.writer.outputs.research_sha256 }}
          EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
          EXPECTED_DRAFT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.draft_sha256 || needs.checker.outputs.draft_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.context_sha256 || needs.checker.outputs.context_sha256 }}
          RULES_SHA256: ${{ needs.writer.outputs.rules_sha256 }}
          RULES_COMMIT: ${{ needs.writer.outputs.repo_sha }}
        run: node scripts/finalize-run.mjs "$RUN_ID"
      - name: Derive source yield from the original scan and completed independent checks
        if: always()
        env:
          EXPECTED_SOURCE_SCAN_SHA: ${{ needs.writer.outputs.source_scan_sha256 }}
          EXPECTED_DRAFT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.draft_sha256 || needs.checker.outputs.draft_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.context_sha256 || needs.checker.outputs.context_sha256 }}
          RULES_SHA256: ${{ needs.writer.outputs.rules_sha256 }}
        run: node scripts/record-source-attribution.mjs "$RUN_ID"
      - name: Record verified demand learning or an explicit unknown result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LEARNING_SELECTION_SHA: ${{ needs.writer.outputs.learning_selection_sha256 }}
          EXPECTED_SOURCE_SCAN_SHA: ${{ needs.writer.outputs.source_scan_sha256 }}
          EXPECTED_DRAFT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.draft_sha256 || needs.checker.outputs.draft_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ needs.final_check.outputs.context_sha256 != '' && needs.final_check.outputs.context_sha256 || needs.checker.outputs.context_sha256 }}
        run: node scripts/record-learning.mjs "$RUN_ID"
      - name: Record candidate revisions and independently established outcomes
        if: always()
        env:
          EXPECTED_RESEARCH_INTENT_SHA: ${{ needs.writer.outputs.research_intent_sha256 }}
          EXPECTED_RESEARCH_RESULT_SHA: ${{ needs.writer.outputs.research_result_sha256 }}
        run: node scripts/record-candidate-development.mjs "$RUN_ID"
      - name: Commit research, picking, rejection and publication records separately
        if: always()
        run: node scripts/commit-records.mjs loop "$RUN_ID"
  pages:
    needs: record
    if: always() && needs.record.result == 'success'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
  report-status:
    needs: [record, pages]
    if: always() && needs.record.outputs.operational_failure == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the operational failure after committing and deploying its record
        run: |
          echo '::error::The loop recorded an operational failure. See the public machine record for the bounded reason and retry state.'
          exit 1
