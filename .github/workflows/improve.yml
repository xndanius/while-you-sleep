name: Improve one rule with blind held-out trials
on:
  schedule:
    # Cheap half-hour gates catch up the daily 22:13 slot without model calls
    # or commits after its terminal adoption/rejection has been recorded.
    - cron: '13,43 * * * *'
      timezone: Europe/Vilnius
  workflow_dispatch:
    inputs:
      clock_tick_run_id:
        description: Trusted hosted clock parent run, verified against its receipt
        type: string
        default: ''
      clock_dispatch_id:
        description: Exact dispatch receipt identifier
        type: string
        default: ''
      clock_parent_attempt:
        description: Hosted clock parent attempt
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: while-you-sleep-improvement
  cancel-in-progress: false
  queue: max
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    outputs:
      due: ${{ steps.gate.outputs.due }}
      run_id: ${{ steps.gate.outputs.runId }}
      job_key: ${{ steps.gate.outputs.jobKey }}
      scheduled_at: ${{ steps.gate.outputs.scheduledAt }}
      clock: ${{ steps.gate.outputs.clock }}
      clock_verified: ${{ steps.gate.outputs.clock_verified }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Keep one hosted clock chain alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-clock.mjs
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK_TICK_RUN_ID: ${{ inputs.clock_tick_run_id || '' }}
          CLOCK_DISPATCH_ID: ${{ inputs.clock_dispatch_id || '' }}
          CLOCK_PARENT_ATTEMPT: ${{ inputs.clock_parent_attempt || '' }}
        run: node scripts/prepare-scheduled-job.mjs improve
  seed:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.seed.outputs.ready }}
      input_sha256: ${{ steps.seed.outputs.inputSha256 }}
      research_sha256: ${{ steps.seed.outputs.researchSha256 }}
    env:
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      SCHEDULED_JOB_KEY: ${{ needs.gate.outputs.job_key }}
      SCHEDULED_AT: ${{ needs.gate.outputs.scheduled_at }}
      SCHEDULED_CLOCK_JSON: ${{ needs.gate.outputs.clock }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - id: seed
        run: node scripts/prepare-improvement.mjs seed "$RUN_ID"
      - name: Preserve frozen cases without granting proposer access
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-input
          path: |
            data/research/${{ env.RUN_ID }}.json
            data/improvements/${{ env.RUN_ID }}-input.json
          if-no-files-found: warn
      - if: steps.seed.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-proposer
          path: .run/proposer/
          include-hidden-files: true
          if-no-files-found: error
  propose:
    # The pinned action supplies --skip-git-repo-check for these empty runners.
    needs: [gate, seed]
    if: needs.seed.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_ID: ${{ needs.gate.outputs.run_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-proposer
          path: .run/proposer
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          prompt-file: ${{ github.workspace }}/.run/proposer/PROMPT.md
          working-directory: ${{ github.workspace }}/.run/proposer
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          codex-args: '["--ephemeral", "--json"]'
      - name: Record missing or malformed proposals without losing the audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { promises as fs } from 'node:fs';
          const file='.run/proposer/proposal.json', runId=process.env.RUN_ID;
          let proposal;
          try { proposal=JSON.parse(await fs.readFile(file,'utf8')); } catch {}
          if (!proposal || typeof proposal!=='object' || Array.isArray(proposal) || proposal.runId!==runId) {
            await fs.mkdir('.run/proposer',{recursive:true});
            await fs.writeFile(file,JSON.stringify({runId,status:'unavailable',reason:'Proposer did not produce a complete JSON proposal.'},null,2)+'\n');
          }
          NODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-proposal
          path: .run/proposer/proposal.json
          include-hidden-files: true
          if-no-files-found: error
  validate-proposal:
    needs: [gate, seed, propose]
    if: needs.propose.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
    env:
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      EXPECTED_INPUT_SHA256: ${{ needs.seed.outputs.input_sha256 }}
      EXPECTED_RESEARCH_SHA256: ${{ needs.seed.outputs.research_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-input
          path: .staging/input
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/input input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-proposal
          path: .staging/proposal
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/proposal proposal
      - id: validate
        name: Reject invalid proposals as a successful decision
        run: node scripts/prepare-improvement.mjs validate "$RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-validation
          path: .run/validation.json
          if-no-files-found: error
  prepare-trials:
    needs: [gate, seed, propose, validate-proposal]
    if: needs.validate-proposal.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, proposal]
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      VARIANT: ${{ matrix.variant }}
      EXPECTED_INPUT_SHA256: ${{ needs.seed.outputs.input_sha256 }}
      EXPECTED_RESEARCH_SHA256: ${{ needs.seed.outputs.research_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-input
          path: .staging/input
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/input input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-proposal
          path: .staging/proposal
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/proposal proposal
      - run: node scripts/prepare-improvement.mjs trial "$RUN_ID" "$VARIANT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-assigned-${{ matrix.variant }}
          path: .run/trial/
          include-hidden-files: true
          if-no-files-found: error
  trials:
    needs: [gate, prepare-trials]
    if: needs.prepare-trials.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, proposal]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-assigned-${{ matrix.variant }}
          path: .run/trial
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          prompt-file: ${{ github.workspace }}/.run/trial/PROMPT.md
          working-directory: ${{ github.workspace }}/.run/trial
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          codex-args: '["--ephemeral", "--json"]'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-trial-${{ matrix.variant }}
          path: .run/trial/trial.json
          include-hidden-files: true
          if-no-files-found: warn
  blind:
    needs: [gate, seed, propose, trials]
    if: needs.trials.result == 'success'
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      EXPECTED_INPUT_SHA256: ${{ needs.seed.outputs.input_sha256 }}
      EXPECTED_RESEARCH_SHA256: ${{ needs.seed.outputs.research_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-input
          path: .staging/input
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/input input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-proposal
          path: .staging/proposal
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/proposal proposal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-trial-baseline
          path: .staging/baseline
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/baseline trial-baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-trial-proposal
          path: .staging/challenger
      - run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/challenger trial-proposal
      - run: node scripts/prepare-improvement.mjs blind "$RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-blind
          path: .run/blind/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-evaluation
          path: |
            data/improvements/${{ env.RUN_ID }}-labels.json
            data/improvements/${{ env.RUN_ID }}-blind.json
  grade:
    needs: [gate, blind]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-blind
          path: .run/blind
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: ${{ needs.gate.outputs.clock_verified == 'true' && 'github-actions[bot]' || '' }}
          prompt-file: ${{ github.workspace }}/.run/blind/PROMPT.md
          working-directory: ${{ github.workspace }}/.run/blind
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          effort: low
          codex-args: '["--ephemeral", "--json"]'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: improvement-grade
          path: .run/blind/grade.json
          include-hidden-files: true
          if-no-files-found: warn
  commit:
    needs: [gate, seed, propose, validate-proposal, prepare-trials, trials, blind, grade]
    if: always() && needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: while-you-sleep-record
      cancel-in-progress: false
      queue: max
    env:
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      GH_TOKEN: ${{ github.token }}
      SCHEDULED_JOB_KEY: ${{ needs.gate.outputs.job_key }}
      SCHEDULED_AT: ${{ needs.gate.outputs.scheduled_at }}
      SCHEDULED_CLOCK_JSON: ${{ needs.gate.outputs.clock }}
      EXPECTED_INPUT_SHA256: ${{ needs.seed.outputs.input_sha256 }}
      EXPECTED_RESEARCH_SHA256: ${{ needs.seed.outputs.research_sha256 }}
      IMPROVEMENT_STAGE_RESULTS: ${{ toJSON(needs) }}
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - id: input
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-input
          path: .staging/input
      - if: steps.input.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/input input
      - id: proposal
        if: needs.propose.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-proposal
          path: .staging/proposal
      - if: steps.proposal.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/proposal proposal
      - id: validation
        if: needs.validate-proposal.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-validation
          path: .staging/validation
      - if: steps.validation.outcome == 'success'
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/validation validation
      - id: baseline
        if: needs.trials.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-trial-baseline
          path: .staging/baseline
      - if: steps.baseline.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/baseline trial-baseline
      - id: challenger
        if: needs.trials.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-trial-proposal
          path: .staging/challenger
      - if: steps.challenger.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/challenger trial-proposal
      - id: evaluation
        if: needs.blind.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-evaluation
          path: .staging/evaluation
      - if: steps.evaluation.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/evaluation evaluation
      - id: grade
        if: needs.grade.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: improvement-grade
          path: .staging/grade
      - if: steps.grade.outcome == 'success'
        continue-on-error: true
        run: node scripts/prepare-improvement.mjs import "$RUN_ID" .staging/grade grade
      - name: Keep failed and missing evaluations unavailable for the audit
        run: node scripts/prepare-improvement.mjs ensure-grade "$RUN_ID"
      - name: Apply exact hashes, higher-score and immutable safety gates
        run: node scripts/apply-improvement.mjs "$RUN_ID"
      - name: Collect only trusted CLI token usage
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-6-luna' }}
          MODEL_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/collect-usage.mjs improve "$RUN_ID"
      - name: Update the daily cost summary from trusted records
        run: node scripts/update-cost-readme.mjs
      - id: push
        name: Commit every decision without model access
        run: |
          git config user.name 'while-you-sleep[bot]'
          git config user.email 'while-you-sleep[bot]@users.noreply.github.com'
          git add -- data/research data/improvements data/versions "data/usage/$RUN_ID.json" RULES.md README.md
          git commit -F .run/improvement-commit-message.txt
          gh auth setup-git
          pushed=false
          for attempt in 1 2 3; do
            node scripts/verify-improvement-rule.mjs "$RUN_ID"
            if git push origin HEAD:main; then pushed=true; break; fi
            git pull --rebase origin main
            node scripts/verify-improvement-rule.mjs "$RUN_ID"
          done
          if [ "$pushed" != true ]; then exit 1; fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  pages:
    needs: commit
    if: needs.commit.result == 'success'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.commit.outputs.ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
