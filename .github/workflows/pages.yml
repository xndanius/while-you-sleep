name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
        required: false
      artifact_name:
        type: string
        default: github-pages
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: while-you-sleep-pages
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce the lecture code freeze while allowing content updates
        run: node scripts/check-code-freeze.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
        env:
          PUBLIC_BASE_URL: https://xndanius.github.io/while-you-sleep
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
          name: ${{ inputs.artifact_name || 'github-pages' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        with:
          artifact_name: ${{ inputs.artifact_name || 'github-pages' }}
